name: Luminus UE Source Validation

on:
  push:
  pull_request:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Unreal source scaffold
        run: python Tools/validate_project.py
      - name: Validate project JSON
        run: python -m json.tool Luminus.uproject > /dev/null
